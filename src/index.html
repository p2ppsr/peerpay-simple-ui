<!DOCTYPE html>
<html>
    <head>
        <!-- Import custom stylesheet -->
        <link href="style.css" type="text/css" rel="stylesheet" /> 
    </head>
    <body class="bg-blur">
        <!-- Must import bsv/sdk tools here since they need to manipulate the DOM for popup window -->
        <script src="./bundle.js"></script>
        <script src="signia.bundle.js"></script>
        <script src="/peerpay-simple-ui/node_modules/@bsv/sdk/dist/umd/bundle.js"></script>
        <script>
            console.log("✅ @bsv/sdk script loaded:", window.bsv);
        </script>
        
        <script src="../../peerpay-client/dist/PeerPayClient.bundle.js"></script>

        <script>
            // Ensure PeerPayClient is correctly assigned
            if (window.PeerPayClient?.default) {
                window.PeerPayClient = window.PeerPayClient.default; // Attach default export as constructor
            }
            console.log("✅ PeerPayClient Loaded:", window.PeerPayClient);

            async function initializePeerPay() {
                console.log("⏳ Initializing PeerPayClient...");

                let retries = 10;
                let interval = setInterval(() => {
                    if (window.bsv) {
                        clearInterval(interval);

                        console.log("✅ @bsv/sdk Loaded:", window.bsv);

                        try {
                            const walletClient = new window.bsv.WalletClient();
                            window.PeerPayClientInstance = new window.PeerPayClient({
                                messageBoxHost: 'https://messagebox.babbage.systems',
                                walletClient
                            });

                            if (!window.PeerPayClientInstance) {
                                throw new Error("🚨 PeerPayClient failed to initialize!");
                            }

                            console.log("✅ PeerPayClient Initialized:", window.PeerPayClientInstance);
                            checkforNewMessages();

                        } catch (error) {
                            console.error("❌ PeerPayClient Initialization Error:", error);
                        }
                    } else if (--retries === 0) {
                        clearInterval(interval);
                        console.error("❌ @bsv/sdk still not found after retries. Ensure it's loaded.");
                    }
                }, 500);
            }

            // 🌟 Ensure the SDK is available before initializing
            initializePeerPay();

            // Initialize Signia
            window.Signia = new window.Signia.Signia(undefined, 'https://staging-signicert.babbage.systems');
            window.Signia.config.confederacyHost = 'https://staging-confederacy.babbage.systems';
        </script>


        <!-- Toast Notification -->
        <div class="toast" id="toast" onclick="{
            document.getElementById('toast').classList.remove('visible')}">
            <div class="toast-body"></div>
        </div>

        <div class="mainContent">
            <!-- Setup the page headers -->
            <img class="headerImage" src="Images/PeerPay.png"/>
            <h4 class="subheading">Peer-to-Peer Payments</h4>
            <p>Enter your recipient's identityKey, the amount, and send your payment!</p>

            <h4 id="identityKey"></h4>
            <button class="tokenButton" onclick="getIdentityKey()">View Your Identity Key</button>

            <!-- Get the user's identity key using the SDK -->
            <script>
                async function getIdentityKey() {
                    try {
                        let identityKey = await window.PeerPayClientInstance.peerPayWalletClient.getPublicKey({ identityKey: true });
                        console.log("🔑 Identity Key:", identityKey.publicKey);
                        document.getElementById('identityKey').innerText = identityKey.publicKey;
                    } catch (error) {
                        console.error("❌ Error fetching identity key:", error);
                    }
                }
            </script>

            <!-- Example input form -->
            <form>
                <label for="recipient">Recipient</label><br>
                <input type="text" id="recipient" name="recipient" placeholder="identity key or Signia verified identity (first last)" value=""><br>
                <label for="amount">Amount (satoshis)</label><br>
                <input type="text" id="amount" name="amount" placeholder="100"><br><br>
            </form> 

            <!-- Handle submitting the payment -->
            <button class="tokenButton" onclick="handleSubmit()">Send</button>
            <script>
                async function handleSubmit() {
                    document.getElementById("loader").style.display = "block";
                    try {
                        let recipient = document.getElementById('recipient').value;
                        let amount = Number(document.getElementById('amount').value);
                        if (!recipient || amount <= 0) {
                            showAlert('Please fill out the required fields!');
                            document.getElementById("loader").style.display = "none";
                            return;
                        }

                        await window.PeerPayClientInstance.sendPayment({ 
                            recipient,
                            amount
                        });

                        console.log("✅ Payment Sent:", { recipient, amount });

                        document.getElementById("loader").style.display = "none";
                        showAlert("Payment Sent! 🎉");
                        setTimeout(() => { location.reload() }, 1500);
                    } catch (error) {
                        console.error("❌ Payment Error:", error);
                        showAlert("Something went wrong! 😬");
                        document.getElementById("loader").style.display = "none";
                    }
                }
            </script>

            <div id="loader" class="loader"></div>

            <!-- Display new payments in a table -->
            <h2 id="messageBoxStatus"></h2>
            <table id="myMessages">
                <tbody id="tbody">
                    <tr>
                        <th>Sender</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                </tbody>
            </table>

            <!-- Check for incoming payments -->
            <script>
                let list = document.getElementById("myMessages");
                document.getElementById("loader").style.display = "none";
                list.style.display = "none";

                async function checkforNewMessages() {
                    console.log("⏳ Checking for new messages...");
                    document.getElementById("loader").style.display = "block";
                    let payments = [];

                    try {
                        payments = await window.PeerPayClientInstance.listIncomingPayments();
                        console.log("📥 Payments Retrieved:", payments);
                    } catch (error) {
                        console.error("❌ Error fetching payments:", error);
                    }

                    document.getElementById("loader").style.display = "none";
                }
            </script>
        </div>
    </body>
</html>
