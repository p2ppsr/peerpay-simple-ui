<!DOCTYPE html>
<html>
    <head>
        <!-- Import custom stylesheet -->
        <link href="style.css" type="text/css" rel="stylesheet" />
        <script src="signia.bundle.js"></script>
    </head>
    <body class="bg-blur">
        <script type="module">
            import PeerPayClient from '../../peerpay-client/dist/src/PeerPayClient.js';

            async function initializePeerPay() {
                try {
                    // Ensure bsvsdk is available
                    if (!window.bsvsdk) {
                        console.error("bsvsdk is not loaded. Ensure @bsv/sdk is included in the project.");
                        return;
                    }

                    const walletClient = new window.bsv.WalletClient();

                    window.PeerPayClient = new PeerPayClient({
                        messageBoxHost: 'https://messagebox.babbage.systems',
                        walletClient
                    });

                    console.log("PeerPayClient Initialized:", window.PeerPayClient);

                    // Ensure it's fully initialized before calling checkforNewMessages
                    setTimeout(() => {
                        if (window.PeerPayClient) {
                            checkforNewMessages();
                        } else {
                            console.error("PeerPayClient is still undefined after delay!");
                        }
                    }, 2000); // 2-second delay to ensure initialization

                } catch (error) {
                    console.error("Failed to initialize PeerPayClient:", error);
                }
            }

            initializePeerPay();
        </script>

        <!-- Toast Notification -->
        <div class="toast" id="toast" onclick="{
            document.getElementById('toast').classList.remove('visible')}">
            <div class="toast-body"></div>
        </div>

        <div class="mainContent">
            <!-- Setup the page headers -->
            <img class="headerImage" src="Images/PeerPay.png"/>
            <h4 class="subheading">Peer-to-Peer Payments</h4>
            <p>Enter your recipient's identityKey, the amount, and send your payment!</p>

            <h4 id="identityKey"></h4>
            <button class="tokenButton" onclick="getIdentityKey()">View Your Identity Key</button>

            <script>
                async function getIdentityKey() {
                    try {
                        let identityKey = await window.PeerPayClient.walletClient.getPublicKey({ identityKey: true });
                        document.getElementById('identityKey').innerText = identityKey.publicKey;
                    } catch (error) {
                        console.error("Error fetching identity key:", error);
                    }
                }
            </script>

            <!-- Example input form -->
            <form>
                <label for="recipient">Recipient Identity Key</label><br>
                <input type="text" id="recipient" name="recipient" placeholder="Enter recipient identity key" value=""><br>
                <label for="amount">Amount (satoshis)</label><br>
                <input type="text" id="amount" name="amount" placeholder="100"><br><br>
            </form> 

            <!-- Handle submitting the payment -->
            <button class="tokenButton" onclick="handleSubmit()">Send</button>
            <script>
                async function handleSubmit() {
                    document.getElementById("loader").style.display = "block";
                    try {
                        let recipient = document.getElementById('recipient').value;
                        let amount = Number(document.getElementById('amount').value);
                        if (!recipient || amount <= 0) {
                            showAlert('Please fill out the required fields!');
                            document.getElementById("loader").style.display = "none";
                            return;
                        }

                        await window.PeerPayClient.sendPayment({ 
                            recipient,
                            amount
                        });

                        document.getElementById("loader").style.display = "none";
                        showAlert("Payment Sent! 🎉");
                        setTimeout(() => { location.reload() }, 1500);
                    } catch (error) {
                        console.error("Error sending payment:", error);
                        showAlert("Something went wrong! 😬");
                        document.getElementById("loader").style.display = "none";
                    }
                }
            </script>

            <div id="loader" class="loader"></div>

            <!-- Display new payments in a table -->
            <h2 id="messageBoxStatus"></h2>
            <table id="myMessages">
                <tbody id="tbody">
                    <tr>
                        <th>Sender</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                </tbody>
            </table>

            <!-- Check for incoming payments -->
            <script>
                let list = document.getElementById("myMessages");
                document.getElementById("loader").style.display = "none";
                list.style.display = "none";

                function showAlert(message, duration = 4000) {
                    const toast = document.getElementById('toast');
                    toast.querySelector('.toast-body').innerHTML = message;
                    toast.classList.add('visible');
                    setTimeout(() => { toast.classList.remove('visible') }, duration);
                }

                async function checkforNewMessages() {
                    if (!window.PeerPayClient) {
                        console.error("PeerPayClient is not initialized!");
                        return;
                    }

                    document.getElementById("loader").style.display = "block";
                    let payments = [];

                    try {
                        console.log("Fetching payments...");
                        payments = await window.PeerPayClient.listIncomingPayments();
                        console.log("Payments retrieved:", payments);
                    } catch (error) {
                        console.error("Error fetching payments:", error);
                    }

                    document.getElementById("loader").style.display = "none";

                    if (!payments || payments.length === 0) {
                        document.getElementById('messageBoxStatus').innerText = 'No new payments';
                    } else {
                        document.getElementById('messageBoxStatus').innerText = 'Incoming Payments';
                        list.style.display = "block";
                        showAlert("New Payments");

                        payments.forEach((payment) => {
                            let tblBody = document.getElementById("tbody");
                            const row = document.createElement("tr");

                            // Sender
                            const senderCell = document.createElement("td");
                            senderCell.appendChild(document.createTextNode(payment.sender));
                            row.appendChild(senderCell);

                            // Date
                            const dateCell = document.createElement("td");
                            dateCell.appendChild(document.createTextNode(new Date(payment.created_at).toLocaleString()));
                            row.appendChild(dateCell);

                            // Amount
                            const amountCell = document.createElement("td");
                            amountCell.appendChild(document.createTextNode(payment.token.body.amount + ' sats'));
                            row.appendChild(amountCell);

                            // Accept Button
                            const acceptBtn = document.createElement("BUTTON");
                            acceptBtn.innerHTML = "Accept";
                            acceptBtn.classList.add('acceptButton');
                            acceptBtn.onclick = async () => {
                                document.getElementById("loader").style.display = "block";
                                try {
                                    await window.PeerPayClient.acceptPayment(payment);
                                    document.getElementById("loader").style.display = "none";
                                    showAlert("Payment Received!");
                                } catch (error) {
                                    document.getElementById("loader").style.display = "none";
                                    showAlert(error);
                                }
                                setTimeout(() => { location.reload() }, 1500);
                            };
                            const actionCell = document.createElement("td");
                            actionCell.appendChild(acceptBtn);
                            row.appendChild(actionCell);
                            tblBody.appendChild(row);
                        });
                    }
                }

                checkforNewMessages();
            </script>
        </div>
    </body>
</html>
