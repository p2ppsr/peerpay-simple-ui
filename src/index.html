<!DOCTYPE html>
<html>
    <head>
        <!-- Import custom stylesheet -->
        <link href="style.css" type="text/css" rel="stylesheet" /> 
    </head>
    <body class="bg-blur">
        <!-- Must import Babbage tools here since they need to manipulate the DOM for popup window -->
        <script src="signia.bundle.js"></script>
        <script type="module">
            import * as bsvsdk from "https://cdn.jsdelivr.net/npm/@bsv/sdk/dist/sdk.bundle.js";
            window.bsv = bsvsdk; // Ensure it is properly attached
            console.log("@bsv/sdk loaded and attached to window.bsv:", window.bsv);
        </script>
        
        <script>
            console.log("bsvsdk Loaded:", window.bsv); // Debug log to confirm if it's attached
        </script>
     
        <script src="../../peerpay-client/dist/PeerPayClient.bundle.js"></script>

        <script>
            async function initializePeerPay() {
                console.log("⏳ Initializing PeerPayClient...");

                // Wait for `bsvsdk` to load
                let retries = 10;
                let interval = setInterval(() => {
                    if (window.bsv) {  // Ensure we are checking the correct reference
                        clearInterval(interval);

                        console.log("bsvsdk Loaded:", window.bsv);

                        try {
                            // Initialize wallet client
                            const walletClient = new window.bsv.WalletClient();

                            // Initialize PeerPayClient
                            window.PeerPayClient = new window.PeerPayClient({
                                messageBoxHost: 'https://messagebox.babbage.systems',
                                walletClient
                            });

                            if (!window.PeerPayClient) {
                                throw new Error("PeerPayClient failed to initialize!");
                            }

                            console.log("PeerPayClient Initialized:", window.PeerPayClient);
                            checkforNewMessages();

                        } catch (error) {
                            console.error("PeerPayClient Initialization Error:", error);
                        }

                    } else if (--retries === 0) {
                        clearInterval(interval);
                        console.error("bsvsdk still not found after retries. Ensure it's loaded.");
                    }
                }, 500);
            }



            window.Signia = new window.Signia.Signia(undefined, 'https://staging-signicert.babbage.systems');
            window.Signia.config.confederacyHost = 'https://staging-confederacy.babbage.systems';

            initializePeerPay();
        </script>

        <!-- Toast Notification -->
        <div class="toast" id="toast" onclick="{
            document.getElementById('toast').classList.remove('visible')}">
            <div class="toast-body"></div>
        </div>

        <div class="mainContent">
            <!-- Setup the page headers -->
            <img class="headerImage" src="Images/PeerPay.png"/>
            <h4 class="subheading">Peer-to-Peer Payments</h4>
            <p>Enter your recipient's identityKey, the amount, and send your payment!</p>

            <h4 id="identityKey"></h4>
            <button class="tokenButton" onclick="getIdentityKey()">View Your Identity Key</button>

            <!-- Get the user's identity key using the SDK -->
            <script>
                async function getIdentityKey() {
                    try {
                        let identityKey = await window.PeerPayClient.peerPayWalletClient.getPublicKey({ identityKey: true });
                        console.log("🔑 Identity Key:", identityKey.publicKey);
                        document.getElementById('identityKey').innerText = identityKey.publicKey;
                    } catch (error) {
                        console.error("❌ Error fetching identity key:", error);
                    }
                }
            </script>

            <!-- Example input form -->
            <form>
                <label for="recipient">Recipient</label><br>
                <input type="text" id="recipient" name="recipient" placeholder="identity key or Signia verified identity (first last)" value=""><br>
                <label for="amount">Amount (satoshis)</label><br>
                <input type="text" id="amount" name="amount" placeholder="100"><br><br>
            </form> 

            <!-- Handle submitting the payment -->
            <button class="tokenButton" onclick="handleSubmit()">Send</button>
            <script>
                async function handleSubmit() {
                    document.getElementById("loader").style.display = "block";
                    try {
                        let recipient = document.getElementById('recipient').value;
                        let amount = Number(document.getElementById('amount').value);
                        if (!recipient || amount <= 0) {
                            showAlert('Please fill out the required fields!');
                            document.getElementById("loader").style.display = "none";
                            return;
                        }

                        if (recipient.length !== 66) {
                            let results = await window.Signia.discoverByAttributes({ 
                                firstName: recipient.split(" ")[0], 
                                lastName: recipient.split(" ")[1] 
                            });
                            if (!results || results.length === 0) {
                                showAlert("No matching identity found! 😬");
                            }

                            recipient = results[0].subject;
                        }

                        await window.PeerPayClient.sendPayment({ 
                            recipient,
                            amount
                        });

                        console.log("✅ Payment Sent:", { recipient, amount });

                        document.getElementById("loader").style.display = "none";
                        showAlert("Payment Sent! 🎉");
                        setTimeout(() => { location.reload() }, 1500);
                    } catch (error) {
                        console.error("❌ Payment Error:", error);
                        showAlert("Something went wrong! 😬");
                        document.getElementById("loader").style.display = "none";
                    }
                }
            </script>

            <div id="loader" class="loader"></div>

            <!-- Display new payments in a table -->
            <h2 id="messageBoxStatus"></h2>
            <table id="myMessages">
                <tbody id="tbody">
                    <tr>
                        <th>Sender</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                </tbody>
            </table>

            <!-- Check for incoming payments -->
            <script>
                let list = document.getElementById("myMessages");
                document.getElementById("loader").style.display = "none";
                list.style.display = "none";

                async function checkforNewMessages() {
                    console.log("⏳ Checking for new messages...");
                    document.getElementById("loader").style.display = "block";
                    let payments = [];

                    try {
                        payments = await window.PeerPayClient.listIncomingPayments();
                        console.log("📥 Payments Retrieved:", payments);
                    } catch (error) {
                        console.error("❌ Error fetching payments:", error);
                    }

                    document.getElementById("loader").style.display = "none";

                    if (!payments || payments.length === 0) {
                        document.getElementById('messageBoxStatus').innerText = 'No new payments';
                    } else {
                        document.getElementById('messageBoxStatus').innerText = 'Incoming Payments';
                        list.style.display = "block";
                        showAlert("New Payments");

                        payments.forEach((payment) => {
                            let tblBody = document.getElementById("tbody");
                            const row = document.createElement("tr");

                            // Sender
                            const senderCell = document.createElement("td");
                            senderCell.appendChild(document.createTextNode(payment.sender));
                            row.appendChild(senderCell);

                            // Date
                            const dateCell = document.createElement("td");
                            dateCell.appendChild(document.createTextNode(new Date(payment.created_at).toLocaleString()));
                            row.appendChild(dateCell);

                            // Amount
                            const amountCell = document.createElement("td");
                            amountCell.appendChild(document.createTextNode(payment.token.body.amount + ' sats'));
                            row.appendChild(amountCell);

                            // Accept Button
                            const acceptBtn = document.createElement("BUTTON");
                            acceptBtn.innerHTML = "Accept";
                            acceptBtn.classList.add('acceptButton');
                            acceptBtn.onclick = async () => {
                                document.getElementById("loader").style.display = "block";
                                try {
                                    await window.PeerPayClient.acceptPayment(payment);
                                    document.getElementById("loader").style.display = "none";
                                    showAlert("Payment Received!");
                                } catch (error) {
                                    console.error("❌ Accept Payment Error:", error);
                                    document.getElementById("loader").style.display = "none";
                                    showAlert(error);
                                }
                                setTimeout(() => { location.reload() }, 1500);
                            };
                            const actionCell = document.createElement("td");
                            actionCell.appendChild(acceptBtn);
                            row.appendChild(actionCell);
                            tblBody.appendChild(row);
                        });
                    }
                }
            </script>
        </div>
    </body>
</html>
